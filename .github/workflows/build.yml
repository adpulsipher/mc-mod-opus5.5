name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Server game tests
        run: ./gradlew runGameTest --stacktrace
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
      - name: Client game tests (screenshots)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace
      - name: List screenshots
        if: always()
        run: find . -path ./.git -prune -o -name '*.png' -path '*screenshot*' -print
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            build/**/screenshots/**
            run/**/screenshots/**
          if-no-files-found: warn
      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: echoes-of-the-past
          path: build/libs/
