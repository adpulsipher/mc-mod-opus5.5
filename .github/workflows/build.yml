name: build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_screenshots:
        description: 'Commit client game test screenshots to docs/screenshots'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: gradle
      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --quiet 2>&1 | tee build.log
      - name: Server game tests
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee gametest.log
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
      - name: Client game tests (screenshots)
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --no-daemon 2>&1 | tee clientgametest.log
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            build/**/screenshots/**
            run/**/screenshots/**
          if-no-files-found: ignore
      - name: Publish screenshots
        if: always() && github.event_name == 'workflow_dispatch' && inputs.publish_screenshots
        run: |
          mkdir -p docs/screenshots
          find . -path ./.git -prune -o -path ./docs -prune -o -name '*.png' -path '*screenshot*' -print | while read f; do cp "$f" docs/screenshots/; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update game test screenshots [skip ci]" || echo "No screenshot changes"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: echoes-of-the-past
          path: build/libs/
      - name: Diagnostics summary
        if: always()
        run: |
          echo "===== SCREENSHOTS ====="
          find . -path ./.git -prune -o -name '*.png' -path '*screenshot*' -print || true
          for f in build.log gametest.log clientgametest.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -E -A3 "error:" "$f" | grep -vE "^--$" | sed -E 's#^/home/runner/work/[^ ]*/src/#src/#' | awk '!seen[$0]++' | head -300
            grep -nE "What went wrong|FAILED|Exception|Caused by|Failed to|Couldn't|Unknown|Missing|Invalid|WARN\]|ERROR\]|passed|failed|Test .*(fail|pass)|echoes_of_the_past" "$f" \
              | grep -vE "error:|^\s*at |DEBUG|narrator|flite|Realms|SignedJWT" | cut -c1-400 | awk '!seen[$0]++' | head -120
          done
