name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: gradle
      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
      - name: Server game tests
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee gametest.log
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
      - name: Client game tests (screenshots)
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --no-daemon 2>&1 | tee clientgametest.log
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            build/**/screenshots/**
            run/**/screenshots/**
          if-no-files-found: ignore
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: echoes-of-the-past
          path: build/libs/
      - name: Diagnostics summary
        if: always()
        run: |
          echo "===== SCREENSHOTS ====="
          find . -path ./.git -prune -o -name '*.png' -path '*screenshot*' -print || true
          for f in build.log gametest.log clientgametest.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -nE "error:|\berror\b.*\.java|What went wrong|FAILED|Exception|Caused by|Failed to|Couldn't|Unknown|Missing|Invalid|WARN\]|ERROR\]|passed|failed|Test .*(fail|pass)" "$f" | grep -vE "^\s*at |DEBUG" | head -120
          done
